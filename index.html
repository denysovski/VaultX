<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://i.pinimg.com; media-src 'self'; font-src 'self'; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="preconnect" href="https://i.pinimg.com" />
    <meta name="theme-color" content="#0e0e0e" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preload" href="/fonts/rx100-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/expose-400.woff2" as="font" type="font/woff2" crossorigin />
    <script src="/boot.js"></script>
    <!--app-head-->
  </head>
  <body>
    <div id="vx-boot" class="vxb" aria-hidden="true">
      <div class="vxb__grid"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="vxb__target">
        <span class="vxb__word">VAULTX</span>
        <span class="vxb__box"><span class="vxb__tag">SUBJECT / LOCATING</span><span class="vxb__tag vxb__tag--ok">SUBJECT / LOCKED 0.98</span></span>
      </div>
      <ul class="vxb__log">
        <li>&gt; init vaultx.core 7.4.1</li>
        <li>&gt; mount /drop/07 ... ok</li>
        <li>&gt; calibrate tracker ... ok</li>
        <li>&gt; colour -&gt; grey 100%</li>
        <li>&gt; signal prague 4 ms</li>
        <li>&gt; enter</li>
      </ul>
      <div class="vxb__meter"><span class="vxb__pct">000</span><span class="vxb__bar"><i></i></span></div>
    </div>
    <div id="root" data-path="<!--app-path-->"><!--app-html--></div>
    <noscript><p style="padding:16px">VAULTX needs JavaScript for the bag and checkout. Everything else is readable without it.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
